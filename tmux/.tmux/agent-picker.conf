# Prefix + i: fuzzy picker over panes running AI agents (requires tmux >= 3.2 and fzf).
# run-shell expands client_name; display-popup's -e option keeps formats literal.
bind-key i run-shell -b 'tmux display-popup -c "#{client_name}" -B -E -w 90% -h 80% -e "TMUX_PICKER_CLIENT=#{client_name}" "sh ~/.tmux/agent-picker.sh"'
